<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mis XV Años - Elisa Serrano Serrano</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600&family=Montserrat:wght@400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f7e7ce;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #f7e7ce 100%);
            font-family: 'Montserrat', sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 10px 0 80px 0;
        }

        .main-wrapper {
            width: 100%;
            max-width: 480px;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 0 10px;
        }

        /* Contenedor de la Imagen e Interactividad */
        .image-container {
            position: relative;
            width: 100%;
            border-radius: 16px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.25);
            background: #fff;
        }

        .invitation-img {
            width: 100%;
            height: auto;
            display: block;
        }

        /* Capas invisibles sobre las direcciones en la imagen para Google Maps */
        .location-overlay-misa {
            position: absolute;
            top: 42%;
            left: 10%;
            width: 80%;
            height: 5.5%;
            cursor: pointer;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.0);
            transition: background 0.3s ease;
        }

        .location-overlay-recepcion {
            position: absolute;
            top: 48%;
            left: 10%;
            width: 80%;
            height: 6%;
            cursor: pointer;
            border-radius: 8px;
            background: rgba(255, 255, 255, 0.0);
            transition: background 0.3s ease;
        }

        .location-overlay-misa:hover, .location-overlay-recepcion:hover {
            background: rgba(212, 160, 23, 0.15);
            border: 1px dashed #d4af37;
        }

        /* Sección del Contador Regresivo */
        .countdown-section {
            width: 100%;
            margin-top: 20px;
            background: rgba(255, 255, 255, 0.92);
            backdrop-filter: blur(10px);
            border-radius: 16px;
            padding: 20px 15px;
            text-align: center;
            box-shadow: 0 8px 20px rgba(0,0,0,0.12);
            border: 2px solid #e0a96d;
        }

        .countdown-title {
            font-family: 'Cinzel', serif;
            color: #8a3a50;
            font-size: 1.1rem;
            margin-bottom: 12px;
            letter-spacing: 1px;
            text-transform: uppercase;
        }

        .timer-grid {
            display: flex;
            justify-content: space-around;
            align-items: center;
        }

        .time-box {
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .time-value {
            font-size: 1.6rem;
            font-weight: 600;
            color: #722f37;
            background: #fff0f3;
            padding: 8px 12px;
            border-radius: 8px;
            min-width: 55px;
            box-shadow: inset 0 0 5px rgba(0,0,0,0.05);
            border: 1px solid #f8bbd0;
        }

        .time-label {
            font-size: 0.75rem;
            color: #666;
            margin-top: 5px;
            text-transform: uppercase;
        }

        /* Botón de Confirmación WhatsApp */
        .whatsapp-section {
            width: 100%;
            margin-top: 15px;
            margin-bottom: 20px;
        }

        .btn-whatsapp {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            background: linear-gradient(135deg, #25D366 0%, #128C7E 100%);
            color: white;
            text-decoration: none;
            padding: 16px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.05rem;
            box-shadow: 0 6px 18px rgba(37, 211, 102, 0.4);
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .btn-whatsapp:active {
            transform: scale(0.98);
        }

        .btn-whatsapp i {
            font-size: 1.4rem;
        }

        /* Control Flotante de Música */
        .music-btn {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 52px;
            height: 52px;
            background: linear-gradient(135deg, #e0a96d 0%, #8a3a50 100%);
            color: white;
            border-radius: 50%;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 1.3rem;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            z-index: 1000;
            border: 2px solid #fff;
            transition: transform 0.2s ease;
        }

        .music-btn.playing i {
            animation: spin 3s linear infinite;
        }

        @keyframes spin {
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <!-- Reproductor de Audio -->
    <!-- Reemplaza "musica.mp3" con la ruta de tu archivo de música en GitHub si usas otro archivo -->
    <audio id="bg-music" loop>
        <source src="musica.mp3" type="audio/mpeg">
      
    </audio>

    <!-- Botón Flotante para Encender/Pausar Música -->
    <div class="music-btn" id="music-toggle" title="Reproducir/Pausar música">
        <i class="fas fa-music"></i>
    </div>

    <div class="main-wrapper">
        
        <!-- 1. Imagen de la Invitación scrolleable con capas táctiles -->
        <div class="image-container">
            <img src="image.jpg" alt="Invitación Elisa Serrano Serrano" class="invitation-img">
            
            <!-- Enlace interactivo sobre la Misa -->
            <a href="https://maps.google.com/?q=Santuario+San+Miguel+del+Milagro+Tlaxcala" 
               target="_blank" 
               class="location-overlay-misa" 
               title="Ver ubicación de la Misa en Google Maps"></a>

            <!-- Enlace interactivo sobre la Recepción -->
            <a href="https://maps.google.com/?q=Av.+Revolucion+131+San+Rafael+Tenanyecac" 
               target="_blank" 
               class="location-overlay-recepcion" 
               title="Ver ubicación de la Recepción en Google Maps"></a>
        </div>

        <!-- 2. Contador Regresivo debajo de la imagen -->
        <div class="countdown-section">
            <div class="countdown-title">Faltan para el gran día</div>
            <div class="timer-grid">
                <div class="time-box">
                    <span class="time-value" id="days">00</span>
                    <span class="time-label">Días</span>
                </div>
                <div class="time-box">
                    <span class="time-value" id="hours">00</span>
                    <span class="time-label">Horas</span>
                </div>
                <div class="time-box">
                    <span class="time-value" id="minutes">00</span>
                    <span class="time-label">Min</span>
                </div>
                <div class="time-box">
                    <span class="time-value" id="seconds">00</span>
                    <span class="time-label">Seg</span>
                </div>
            </div>
        </div>

        <!-- 3. Botón de WhatsApp debajo del contador -->
        <div class="whatsapp-section">
            <a href="https://wa.me/522223711331?text=%C2%A1Hola!%20Con%20mucho%20gusto%20confirmo%20mi%20asistencia%20a%20los%20XV%20A%C3%B1os%20de%20Elisa%20Serrano%20Serrano." 
               target="_blank" 
               class="btn-whatsapp">
                <i class="fab fa-whatsapp"></i> Confirmar Asistencia por WhatsApp
            </a>
        </div>

    </div>

    <!-- Script para Contador y Control de Música -->
    <script>
        // --- Contador Regresivo ---
        const targetDate = new Date("November 21, 2026 14:00:00").getTime();

        function updateCountdown() {
            const now = new Date().getTime();
            const difference = targetDate - now;

            if (difference > 0) {
                const days = Math.floor(difference / (1000 * 60 * 60 * 24));
                const hours = Math.floor((difference % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                const minutes = Math.floor((difference % (1000 * 60 * 60)) / (1000 * 60));
                const seconds = Math.floor((difference % (1000 * 60)) / 1000);

                document.getElementById("days").innerText = days < 10 ? "0" + days : days;
                document.getElementById("hours").innerText = hours < 10 ? "0" + hours : hours;
                document.getElementById("minutes").innerText = minutes < 10 ? "0" + minutes : minutes;
                document.getElementById("seconds").innerText = seconds < 10 ? "0" + seconds : seconds;
            } else {
                document.getElementById("days").innerText = "00";
                document.getElementById("hours").innerText = "00";
                document.getElementById("minutes").innerText = "00";
                document.getElementById("seconds").innerText = "00";
            }
        }

        setInterval(updateCountdown, 1000);
        updateCountdown();

        // --- Manejo de la Música de Fondo ---
        const music = document.getElementById("bg-music");
        const musicBtn = document.getElementById("music-toggle");
        let isPlaying = false;

        function toggleMusic() {
            if (isPlaying) {
                music.pause();
                musicBtn.classList.remove("playing");
                isPlaying = false;
            } else {
                music.play().then(() => {
                    musicBtn.classList.add("playing");
                    isPlaying = true;
                }).catch(err => {
                    console.log("Autoplay bloqueado por el navegador:", err);
                });
            }
        }

        musicBtn.addEventListener("click", toggleMusic);

        // Iniciar música automáticamente al primer toque/clic en cualquier parte de la pantalla
        document.body.addEventListener("click", function startOnFirstTouch() {
            if (!isPlaying) {
                toggleMusic();
            }
            document.body.removeEventListener("click", startOnFirstTouch);
        }, { once: true });
    </script>
</body>
</html>
